  <main class="container">
    <div class="section-label">— GALLERY</div>

    <div class="plates-masonry">

      <div class="plate-card" data-img="images/plate-1.jpg" data-title="Seafood Pasta">
        <div class="plate-badge">SEAFOOD</div>
        <img src="images/plate-1.jpg" alt="Seafood Pasta" onerror="this.parentElement.classList.add('empty');">
        <div class="plate-caption"><h4>Seafood Pasta</h4><span>01</span></div>
      </div>

      <div class="plate-card" data-img="images/plate-2.jpg" data-title="Creamy Salmon Ravioli">
        <div class="plate-badge">SIGNATURE</div>
        <img src="images/plate-2.jpg" alt="Creamy Salmon Ravioli" onerror="this.parentElement.classList.add('empty');">
        <div class="plate-caption"><h4>Creamy Salmon Ravioli</h4><span>02</span></div>
      </div>

      <div class="plate-card" data-img="images/plate-3.jpg" data-title="Beef Angus">
        <div class="plate-badge">BEEF</div>
        <img src="images/plate-3.jpg" alt="Beef Angus" onerror="this.parentElement.classList.add('empty');">
        <div class="plate-caption"><h4>Beef Angus</h4><span>03</span></div>
      </div>

      <div class="plate-card" data-img="images/plate-4.jpg" data-title="Oriental Fish — Modern">
        <div class="plate-badge">MODERN</div>
        <img src="images/plate-4.jpg" alt="Oriental Fish Modern" onerror="this.parentElement.classList.add('empty');">
        <div class="plate-caption"><h4>Oriental Fish — Modern</h4><span>04</span></div>
      </div>

      <div class="plate-card" data-img="images/plate-5.jpg" data-title="Hara Fish">
        <div class="plate-badge">SPICY</div>
        <img src="images/plate-5.jpg" alt="Hara Fish" onerror="this.parentElement.classList.add('empty');">
        <div class="plate-caption"><h4>Hara Fish</h4><span>05</span></div>
      </div>

      <div class="plate-card" data-img="images/plate-6.jpg" data-title="Beef Wagyu">
        <div class="plate-badge">PREMIUM</div>
        <img src="images/plate-6.jpg" alt="Beef Wagyu" onerror="this.parentElement.classList.add('empty');">
        <div class="plate-caption"><h4>Beef Wagyu</h4><span>06</span></div>
      </div>

    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close">✕</button>
    <button class="lb-prev" aria-label="Previous">‹</button>
    <button class="lb-next" aria-label="Next">›</button>
    <div class="lb-content">
      <img id="lb-img" src="" alt="">
      <div class="lb-caption" id="lb-caption"></div>
    </div>
  </div>
