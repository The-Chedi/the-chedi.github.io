<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kitchen OPS Manager | Add & Manage OSPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #e6edf4 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* main container */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* header area */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f2b3c, #2c3e4e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .title-section p {
            color: #4a627a;
            font-weight: 500;
            margin-top: 0.3rem;
            font-size: 0.9rem;
        }

        .stats-badge {
            background: white;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.05);
            font-weight: 600;
            color: #1f2b3c;
        }

        /* ADD OSP CARD */
        .add-osp-card {
            background: white;
            border-radius: 2rem;
            padding: 1.8rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: flex-end;
        }

        .input-group {
            flex: 1 1 220px;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4e6b85;
        }

        .input-group input, .input-group select {
            padding: 0.8rem 1rem;
            border-radius: 1.2rem;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44, 125, 160, 0.2);
        }

        .btn-primary {
            background: #1f6e8c;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: #0e5a77;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(31, 110, 140, 0.2);
        }

        .btn-secondary {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            background: #e6edf4;
        }

        /* OSPS table & card layout */
        .osps-section {
            background: rgba(255,255,255,0.6);
            border-radius: 1.8rem;
            backdrop-filter: blur(0px);
            padding: 0.2rem 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem 0.8rem 1rem;
            flex-wrap: wrap;
        }

        .section-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e2f3d;
        }

        .filter-bar {
            display: flex;
            gap: 0.7rem;
            align-items: center;
        }

        .kitchen-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.4rem;
            padding: 1rem 0.5rem;
        }

        /* OSP card */
        .osp-card {
            background: white;
            border-radius: 1.6rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
            border: 1px solid #eef2f6;
            overflow: hidden;
        }

        .osp-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1);
            border-color: #cbdde9;
        }

        .card-header {
            padding: 1rem 1.2rem 0.5rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 2px solid #f1f5f9;
        }

        .osp-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            background: linear-gradient(145deg, #1e3a4d, #2c5368);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-active {
            background: #dff9e6;
            color: #117f4a;
            border-left: 3px solid #2ecc71;
        }

        .status-inactive {
            background: #ffe6e5;
            color: #c0392b;
            border-left: 3px solid #e74c3c;
        }

        .status-maintenance {
            background: #fff3e0;
            color: #b85c00;
            border-left: 3px solid #f39c12;
        }

        .card-body {
            padding: 0.9rem 1.2rem 1rem 1.2rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
        }

        .detail-label {
            font-weight: 600;
            color: #5b7a99;
        }

        .detail-value {
            color: #1f3b4c;
            font-weight: 500;
            text-align: right;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.7rem;
            margin-top: 0.8rem;
            padding-top: 0.6rem;
            border-top: 1px solid #eef2f8;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .edit-btn {
            color: #2c7da0;
            background: #eef6fc;
        }

        .edit-btn:hover {
            background: #d9e9f3;
        }

        .delete-btn {
            color: #c44536;
            background: #fef1ef;
        }

        .delete-btn:hover {
            background: #fce4e0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: #f8fafc;
            border-radius: 2rem;
            color: #5e7e9e;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .form-grid {
                flex-direction: column;
            }
            .btn-primary {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div class="title-section">
            <h1>🍳 Kitchen OSPS Hub</h1>
            <p>Operational Status & Procedures — manage your kitchen assets & stations</p>
        </div>
        <div class="stats-badge" id="statsCounter">
            📋 Total OSPS: <span id="totalCount">0</span>
        </div>
    </div>

    <!-- ADD NEW OSP FORM -->
    <div class="add-osp-card">
        <form id="addOspForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>🍽️ OSP Name *</label>
                    <input type="text" id="ospName" placeholder="e.g., Grill Station, Dishwasher, Prep Line" required>
                </div>
                <div class="input-group">
                    <label>📋 Category / Zone</label>
                    <input type="text" id="ospCategory" placeholder="Hot line, Cold prep, Bakery" value="Main Kitchen">
                </div>
                <div class="input-group">
                    <label>⚙️ Status</label>
                    <select id="ospStatus">
                        <option value="Active">✅ Active — Operational</option>
                        <option value="Inactive">⛔ Inactive — Offline</option>
                        <option value="Maintenance">🔧 Maintenance — In Service</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>📝 Notes (optional)</label>
                    <input type="text" id="ospNotes" placeholder="Last check, issues, assignee...">
                </div>
                <div class="input-group">
                    <button type="submit" class="btn-primary">➕ Add Kitchen OSP</button>
                </div>
            </div>
        </form>
    </div>

    <!-- OSPS LIST + FILTER -->
    <div class="osps-section">
        <div class="section-header">
            <h2>📌 Current Operational OSPS</h2>
            <div class="filter-bar">
                <select id="statusFilter" class="btn-secondary" style="background:white;">
                    <option value="all">🏷️ All statuses</option>
                    <option value="Active">✅ Active</option>
                    <option value="Inactive">⛔ Inactive</option>
                    <option value="Maintenance">🔧 Maintenance</option>
                </select>
                <button id="clearAllBtn" class="btn-secondary" type="button" style="border-color:#e2a38f; color:#b3422f;">🗑️ Clear All</button>
            </div>
        </div>

        <div id="kitchenGridContainer" class="kitchen-grid">
            <!-- dynamic cards injected here -->
            <div class="empty-state">✨ No kitchen OSPS yet. Add your first operational station above 👆</div>
        </div>
    </div>
</div>

<script>
    // ---------- KITCHEN OSPS DATA MODEL ----------
    // Each OSP = { id, name, category, status, notes, createdAt }
    let kitchenOSPS = [];

    // Helper: generate random ID (timestamp + random)
    function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
    }

    // Load from localStorage if exists (keep data after refresh)
    function loadFromLocalStorage() {
        const stored = localStorage.getItem('kitchen_osps');
        if (stored) {
            try {
                kitchenOSPS = JSON.parse(stored);
                // ensure each item has valid fields (legacy fix)
                kitchenOSPS = kitchenOSPS.map(osp => ({
                    ...osp,
                    status: osp.status || 'Active',
                    category: osp.category || 'General',
                    notes: osp.notes || ''
                }));
            } catch(e) { console.warn(e); }
        } else {
            // Seed with few realistic examples for demo
            kitchenOSPS = [
                {
                    id: generateId(),
                    name: 'Grill Master Station',
                    category: 'Hot Line',
                    status: 'Active',
                    notes: 'Gas pressure checked, ready for dinner rush',
                    createdAt: new Date().toISOString()
                },
                {
                    id: generateId(),
                    name: 'Dishwashing OSPS',
                    category: 'Warewash',
                    status: 'Maintenance',
                    notes: 'Pump inspection - ETA 2h',
                    createdAt: new Date().toISOString()
                },
                {
                    id: generateId(),
                    name: 'Cold Prep Fridge',
                    category: 'Prep Zone',
                    status: 'Active',
                    notes: 'Temp stable, 4°C',
                    createdAt: new Date().toISOString()
                }
            ];
        }
        renderOSPS();
    }

    // Save to localStorage
    function persistToLocalStorage() {
        localStorage.setItem('kitchen_osps', JSON.stringify(kitchenOSPS));
    }

    // Add new OSP
    function addOSP(name, category, status, notes) {
        if (!name || name.trim() === '') {
            alert('❌ OSP Name is required');
            return false;
        }
        const newOSP = {
            id: generateId(),
            name: name.trim(),
            category: category.trim() || 'Uncategorized',
            status: status,
            notes: notes.trim() || '',
            createdAt: new Date().toISOString()
        };
        kitchenOSPS.unshift(newOSP); // newest on top
        persistToLocalStorage();
        renderOSPS();
        return true;
    }

    // Delete OSP by id
    function deleteOSP(id) {
        if (confirm('Remove this kitchen OSP from the list?')) {
            kitchenOSPS = kitchenOSPS.filter(osp => osp.id !== id);
            persistToLocalStorage();
            renderOSPS();
        }
    }

    // Edit OSP: simple inline prompt (lightweight but functional)
    function editOSP(id) {
        const osp = kitchenOSPS.find(o => o.id === id);
        if (!osp) return;
        
        // quick edit dialog with new name, category, status, notes
        const newName = prompt('✏️ Edit OSP name:', osp.name);
        if (newName !== null && newName.trim() === '') {
            alert('Name cannot be empty');
            return;
        }
        const newCategory = prompt('📂 Edit Category (zone):', osp.category);
        const newStatus = prompt(`Set new status (Active, Inactive, Maintenance):`, osp.status);
        const newNotes = prompt('📝 Edit notes:', osp.notes);
        
        if (newName !== null) osp.name = newName.trim() || osp.name;
        if (newCategory !== null) osp.category = newCategory.trim() || osp.category;
        if (newStatus !== null) {
            const statusMap = ['Active', 'Inactive', 'Maintenance'];
            let updatedStatus = newStatus.trim();
            if (statusMap.includes(updatedStatus)) {
                osp.status = updatedStatus;
            } else {
                alert(`Invalid status. Keeping "${osp.status}". Use Active/Inactive/Maintenance.`);
            }
        }
        if (newNotes !== null) osp.notes = newNotes.trim();
        
        persistToLocalStorage();
        renderOSPS();
    }

    // Clear all OSPS with confirmation
    function clearAllOSPS() {
        if (kitchenOSPS.length === 0) return;
        if (confirm('⚠️ PERMANENT DELETE: Remove ALL kitchen OSPS? This cannot be undone.')) {
            kitchenOSPS = [];
            persistToLocalStorage();
            renderOSPS();
        }
    }

    // Filter and render cards
    function renderOSPS() {
        const filterValue = document.getElementById('statusFilter').value;
        let filtered = [...kitchenOSPS];
        
        if (filterValue !== 'all') {
            filtered = filtered.filter(osp => osp.status === filterValue);
        }
        
        // update total count in header
        document.getElementById('totalCount').innerText = kitchenOSPS.length;
        
        const container = document.getElementById('kitchenGridContainer');
        if (!container) return;
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">🍽️ No OSPS match the filter. Add a new kitchen OSP or change filter.</div>`;
            return;
        }
        
        // generate cards
        let cardsHTML = '';
        filtered.forEach(osp => {
            let statusClass = '';
            if (osp.status === 'Active') statusClass = 'status-active';
            else if (osp.status === 'Inactive') statusClass = 'status-inactive';
            else if (osp.status === 'Maintenance') statusClass = 'status-maintenance';
            
            // format date (created at nice display)
            let createdDate = '—';
            if (osp.createdAt) {
                try {
                    const dateObj = new Date(osp.createdAt);
                    createdDate = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                } catch(e) { createdDate = 'recent'; }
            }
            
            cardsHTML += `
                <div class="osp-card" data-id="${osp.id}">
                    <div class="card-header">
                        <span class="osp-name">${escapeHtml(osp.name)}</span>
                        <span class="status-badge ${statusClass}">${escapeHtml(osp.status)}</span>
                    </div>
                    <div class="card-body">
                        <div class="detail-row">
                            <span class="detail-label">📍 Zone / Category</span>
                            <span class="detail-value">${escapeHtml(osp.category)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📅 Added</span>
                            <span class="detail-value">${escapeHtml(createdDate)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📌 Notes</span>
                            <span class="detail-value">${escapeHtml(osp.notes) || '—'}</span>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn edit-btn" data-action="edit" data-id="${osp.id}">✏️ Edit</button>
                            <button class="action-btn delete-btn" data-action="delete" data-id="${osp.id}">🗑️ Remove</button>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = cardsHTML;
        
        // attach event listeners dynamically for edit/delete buttons
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (id) editOSP(id);
            });
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (id) deleteOSP(id);
            });
        });
    }
    
    // basic XSS prevention
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // event handler for adding new OSP
    document.getElementById('addOspForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('ospName');
        const categoryInput = document.getElementById('ospCategory');
        const statusSelect = document.getElementById('ospStatus');
        const notesInput = document.getElementById('ospNotes');
        
        const name = nameInput.value.trim();
        const category = categoryInput.value.trim();
        const status = statusSelect.value;
        const notes = notesInput.value.trim();
        
        if (addOSP(name, category, status, notes)) {
            // clear form fields after success
            nameInput.value = '';
            categoryInput.value = 'Main Kitchen';
            notesInput.value = '';
            // keep status default active but not needed reset, but user friendly: keep default Active selected
            statusSelect.value = 'Active';
            nameInput.focus();
        }
    });
    
    // filter change listener
    document.getElementById('statusFilter').addEventListener('change', () => {
        renderOSPS();
    });
    
    // clear all button
    document.getElementById('clearAllBtn').addEventListener('click', () => {
        clearAllOSPS();
    });
    
    // initial load: from storage or seeds
    loadFromLocalStorage();
    
    // additional: add quick demo tip - but nothing else
    console.log('Kitchen OSPS ready — add, edit, filter and manage your operational stations.');
</script>
</body>
</html>
