async function getKitchenPasswordFromFirestore(kitchenName) {
    try {
        const kitchenId = kitchenToFirestoreId[kitchenName];
        if (!kitchenId) return null;
        const kitchenDoc = await db.collection("kitchen_passwords").doc(kitchenId).get();
        if (kitchenDoc.exists && kitchenDoc.data().password) {
            return kitchenDoc.data().password;
        }
        const defaultDoc = await db.collection("kitchen_passwords").doc("default_settings").get();
        if (defaultDoc.exists && defaultDoc.data().defaultPassword) {
            return defaultDoc.data().defaultPassword;
        }
        return "kitchen123";
    } catch (error) {
        console.error("Error getting kitchen password:", error);
        return "kitchen123";
    }
}

async function verifyKitchenPasswordWithFirestore(kitchenName, enteredPassword) {
    try {
        const correctPassword = await getKitchenPasswordFromFirestore(kitchenName);
        return enteredPassword === correctPassword;
    } catch (error) {
        console.error("Error verifying password:", error);
        return false;
    }
}

// ============ FIXED getOverallStatus FUNCTION ============
function getOverallStatus(items) {
    if (!items || items.length === 0) return "pending";
    
    let approvedCount = 0;
    let rejectedCount = 0;
    let pendingCount = 0;
    
    items.forEach(item => {
        if (item.status === "approved") {
            approvedCount++;
        } else if (item.status === "rejected") {
            rejectedCount++;
        } else {
            pendingCount++;
        }
    });
    
    // All items are approved
    if (approvedCount === items.length && approvedCount > 0) {
        return "approved";
    }
    
    // All items are rejected
    if (rejectedCount === items.length && rejectedCount > 0) {
        return "rejected";
    }
    
    // Mixed approved and rejected (partial)
    if (approvedCount > 0 && rejectedCount > 0) {
        return "partial";
    }
    
    // Some approved, some pending (partial)
    if (approvedCount > 0 && pendingCount > 0) {
        return "partial";
    }
    
    // All items are pending
    if (pendingCount === items.length) {
        return "pending";
    }
    
    return "pending";
}

async function checkForDuplicateOrder(section, chefName, cartItems) {
    try {
        const snapshot = await db.collection("kitchen_requests").where("section", "==", section).get();
        for (const doc of snapshot.docs) {
            const request = doc.data();
            const requestStatus = getOverallStatus(request.items);
            if (requestStatus === "pending" || requestStatus === "approved") {
                const existingItems = request.items;
                if (existingItems.length === cartItems.length) {
                    let isDuplicate = true;
                    const sortedExisting = [...existingItems].sort((a, b) => (a.code || "").localeCompare(b.code || ""));
                    const sortedNew = [...cartItems].sort((a, b) => (a.code || "").localeCompare(b.code || ""));
                    for (let i = 0; i < sortedNew.length; i++) {
                        if (sortedNew[i].code !== sortedExisting[i].code || Math.abs(sortedNew[i].qty - sortedExisting[i].originalQty) > 0.01) {
                            isDuplicate = false; break;
                        }
                    }
                    if (isDuplicate) { return { isDuplicate: true, existingRequestId: request.requestId, existingTime: request.submittedAt }; }
                }
            }
        }
        return { isDuplicate: false };
    } catch(e) { console.error("Duplicate check error:", e); return { isDuplicate: false }; }
}

async function submitRequest(kitchen) {
    const chefName = chefNames[kitchen];
    const cart = kitchenData[kitchen].cart;
    if (!chefName) { showToast("⚠️ Enter chef name first"); return; }
    if (cart.length === 0) { showToast("No items to submit"); return; }
    
    const duplicateCheck = await checkForDuplicateOrder(kitchen, chefName, cart);
    if (duplicateCheck.isDuplicate) {
        const message = `${t('duplicateBlocked')}!\n\n${t('duplicateMessage')} ${duplicateCheck.existingTime}\nRequest ID: ${duplicateCheck.existingRequestId}\n\nPlease check existing request or modify quantities.`;
        showToast(`🚫 ${t('duplicateBlocked')}!`);
        alert(message);
        return;
    }
    
    const newRequest = {
        requestId: "REQ-" + Date.now().toString().slice(-6),
        chefName: chefName,
        section: kitchen,
        items: cart.map(i => ({ 
            code: i.code, 
            name: i.name, 
            name_ar: i.name_ar, 
            unit: i.unit, 
            originalQty: i.qty, 
            maxLimit: i.maxLimit, 
            price: i.price || 0, 
            status: "pending", 
            approvedQty: 0, 
            rejectionReason: null 
        })),
        submittedAt: new Date().toLocaleString(), 
        timestamp: Date.now()
    };
    
    console.log("Submitting request:", newRequest);
    await saveRequestToFirebase(newRequest);
    kitchenData[kitchen].cart = [];
    renderCart(kitchen);
    saveCart();
    showToast(`✅ Request ${newRequest.requestId} submitted!`);
    await loadRequestsFromFirebase();
    if (currentKitchen) { loadMyRequests(currentKitchen); loadOrderHistory(currentKitchen); }
}

// ============ ITEMS FUNCTIONS ============
async function loadItemsForKitchen(kitchen, forceRefresh = false) {
    if (kitchenItemsCache[kitchen] && !forceRefresh) return kitchenItemsCache[kitchen];
    const fileName = kitchenToFileMap[kitchen];
    if (!fileName) return getDefaultItemsForKitchen(kitchen);
    const url = `items/${fileName}?t=${Date.now()}`;
    try {
        const response = await fetch(url);
        if (!response.ok) {
            console.warn(`Items file not found for ${kitchen}, using defaults`);
            return getDefaultItemsForKitchen(kitchen);
        }
        const data = await response.json();
        let itemsArray = Array.isArray(data) ? data : (data.items || []);
        itemsArray = itemsArray.map(item => ({ 
            ...item, section: item.section || kitchen, price: item.AVE || item.price || 0,
            name_ar: item.name_ar || item.name, step: item.step || (item.unit === "kg" ? 0.5 : 1)
        }));
        kitchenItemsCache[kitchen] = itemsArray;
        return itemsArray;
    } catch (error) { 
        console.warn(`Error loading items for ${kitchen}:`, error);
        return getDefaultItemsForKitchen(kitchen);
    }
}

function getItemsForKitchen(kitchen) { return kitchenItemsCache[kitchen] || []; }

function changeQuantity(kitchen, code, delta, maxLimit) {
    if (!selectedQuantities[kitchen]) selectedQuantities[kitchen] = {};
    let current = selectedQuantities[kitchen][code] || 0;
    let newQty = parseFloat((current + delta).toFixed(1));
    if (newQty < 0) newQty = 0;
    if (!freehandModeActive && newQty > maxLimit) newQty = maxLimit;
    selectedQuantities[kitchen][code] = newQty;
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const safeCode = (code || "").replace(/[^a-zA-Z0-9]/g, '_');
    const span = document.getElementById(`qtySpan_${kitchenId}_${safeCode}`);
    if (span) {
        if (Math.abs(delta) === 0.5) { span.innerText = newQty.toFixed(1); }
        else { span.innerText = Math.floor(newQty); }
    }
}

function addItemWithQuantity(kitchen, code, itemName, unit, maxLimit, price, step) {
    const chefName = chefNames[kitchen];
    if (!chefName) { showToast("⚠️ Enter chef name first"); return; }
    let qty = selectedQuantities[kitchen]?.[code] || 0;
    if (qty <= 0) { showToast(`⚠️ Set quantity > 0 for ${itemName}`); return; }
    const items = getItemsForKitchen(kitchen);
    const item = items.find(i => i.code === code);
    if (!item) return;
    const existing = kitchenData[kitchen].cart.find(i => i.code === code);
    let currentQty = existing ? existing.qty : 0;
    let maxAllowed = freehandModeActive ? 999999 : (item.maxLimit || maxLimit);
    let remaining = maxAllowed - currentQty;
    let actualQtyToAdd = qty;
    if (!freehandModeActive && remaining <= 0) { showToast(`⚠️ Maximum ${maxAllowed} ${item.unit || unit} reached!`); return; }
    if (qty > remaining) { actualQtyToAdd = remaining; showToast(`⚠️ Only ${remaining.toFixed(1)} remaining. Added ${remaining.toFixed(1)} instead of ${qty.toFixed(1)}`); }
    const itemPrice = item.price || price || 0;
    if (existing) { existing.qty += actualQtyToAdd; showToast(`✓ Added ${actualQtyToAdd.toFixed(step === 0.5 ? 1 : 0)} ${getItemName(item)}`); }
    else { kitchenData[kitchen].cart.push({ code: item.code, name: item.name, name_ar: item.name_ar, unit: item.unit || unit, qty: actualQtyToAdd, maxLimit: item.maxLimit || maxLimit, price: itemPrice }); showToast(`✓ Added ${actualQtyToAdd.toFixed(step === 0.5 ? 1 : 0)} ${getItemName(item)}`); }
    if (!addedItemsStatus[kitchen]) addedItemsStatus[kitchen] = {};
    addedItemsStatus[kitchen][code] = true;
    selectedQuantities[kitchen][code] = 0;
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const safeCode = (code || "").replace(/[^a-zA-Z0-9]/g, '_');
    const span = document.getElementById(`qtySpan_${kitchenId}_${safeCode}`);
    if (span) span.innerText = "0";
    const card = document.getElementById(`itemCard_${kitchenId}_${safeCode}`);
    if (card) card.classList.add('selected');
    renderCart(kitchen);
    saveCart();
}

function filterItemsByFirstChar(kitchen, searchChar) {
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const displayDiv = document.getElementById(`itemsDisplay_${kitchenId}`);
    if (!displayDiv) return;
    let filteredItems = currentItemsList;
    if (searchChar && searchChar.trim().length > 0) {
        const lowerChar = searchChar.trim().toLowerCase();
        filteredItems = currentItemsList.filter(item => {
            const itemName = (getItemName(item) || "").toLowerCase();
            const itemCode = (item.code || "").toLowerCase();
            return itemName.startsWith(lowerChar) || itemCode.startsWith(lowerChar);
        });
    }
    if (!filteredItems.length) { displayDiv.innerHTML = `<div class="empty-state">🔍 ${currentLang === 'ar' ? 'لا توجد أصناف تبدأ بـ' : 'No items starting with'} "${searchChar}"</div>`; return; }
    if (!selectedQuantities[kitchen]) selectedQuantities[kitchen] = {};
    if (!addedItemsStatus[kitchen]) addedItemsStatus[kitchen] = {};
    const sortedItems = [...filteredItems].sort((a,b) => (getItemName(a) || "").localeCompare(getItemName(b) || ""));
    let html = `<div class="items-scroll-container"><div class="items-grid">`;
    sortedItems.forEach(item => {
        const currentQty = selectedQuantities[kitchen][item.code] || 0;
        const isSelected = addedItemsStatus[kitchen][item.code] || false;
        const selectedClass = isSelected ? 'selected' : '';
        const safeCode = (item.code || "").replace(/[^a-zA-Z0-9]/g, '_');
        const itemPrice = item.price || 0;
        const displayName = getItemName(item);
        const stepValue = getItemStep(item);
        const stepText = stepValue === 0.5 ? "0.5" : "1";
        const displayQty = stepValue === 0.5 ? currentQty.toFixed(1) : Math.floor(currentQty);
        html += `<div class="item-card ${selectedClass}" id="itemCard_${kitchenId}_${safeCode}">
            <div class="item-main-row"><div class="item-info"><div class="item-name">${escapeHtml(displayName)}</div>
            <div class="item-code">${item.code || "N/A"}</div><div class="item-price">💰 ${itemPrice.toFixed(2)} ${t('egp')} / ${item.unit}</div></div>
            <div class="item-meta"><span class="item-unit">${item.unit || "pcs"}</span>
            <div class="item-max">${t('max')} ${freehandModeActive ? '∞' : (item.maxLimit || 99)}</div><div class="item-step">Step: ${stepText}</div></div>
            <div class="item-actions"><div class="qty-picker">
            <button class="qty-btn" data-step="-${stepValue}" data-code="${item.code}" data-max="${item.maxLimit || 99}">−</button>
            <span class="qty-value" id="qtySpan_${kitchenId}_${safeCode}">${displayQty}</span>
            <button class="qty-btn" data-step="${stepValue}" data-code="${item.code}" data-max="${item.maxLimit || 99}">+</button></div>
            <button class="add-item-btn" data-code="${item.code}" data-name="${escapeHtml(displayName)}" data-unit="${item.unit || "pcs"}" data-max="${item.maxLimit || 99}" data-price="${itemPrice}" data-step="${stepValue}">${t('add')}</button></div></div></div>`;
    });
    html += `</div><div class="scroll-info">📜 ${sortedItems.length} ${t('allItems')}</div></div>`;
    displayDiv.innerHTML = html;
    
    displayDiv.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const step = parseFloat(btn.dataset.step);
            const code = btn.dataset.code;
            const maxLimit = parseFloat(btn.dataset.max);
            changeQuantity(kitchen, code, step, maxLimit);
        });
    });
    displayDiv.querySelectorAll('.add-item-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const code = btn.dataset.code;
            const itemName = btn.dataset.name;
            const unit = btn.dataset.unit;
            const maxLimit = parseFloat(btn.dataset.max);
            const price = parseFloat(btn.dataset.price);
            const step = parseFloat(btn.dataset.step);
            addItemWithQuantity(kitchen, code, itemName, unit, maxLimit, price, step);
        });
    });
}

async function renderItemsList(kitchen) {
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');

// ============ CART FUNCTIONS ============
function renderCart(kitchen) {
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const cart = kitchenData[kitchen].cart;
    const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
    const totalValue = cart.reduce((sum, i) => sum + (i.qty * (i.price || 0)), 0);
    const totalItemsElem = document.getElementById(`totalItems_${kitchenId}`);
    const lineCountElem = document.getElementById(`lineCount_${kitchenId}`);
    const totalValueElem = document.getElementById(`totalValue_${kitchenId}`);
    if (totalItemsElem) totalItemsElem.innerText = totalQty.toFixed(1);
    if (lineCountElem) lineCountElem.innerText = cart.length;
    if (totalValueElem) totalValueElem.innerText = totalValue.toFixed(2);
    const desktopBody = document.getElementById(`cartTableDesktop_${kitchenId}`);
    if (desktopBody) {
        if (cart.length === 0) { desktopBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">${t('noItems')}</td></tr>`; }
        else {
            desktopBody.innerHTML = "";
            cart.forEach((item, idx) => {
                const itemTotal = (item.qty * (item.price || 0)).toFixed(2);
                const displayName = currentLang === 'ar' && item.name_ar ? item.name_ar : item.name;
                desktopBody.innerHTML += `<tr>
                    <td>${item.code}</td>
                    <td><strong>${escapeHtml(displayName)}</strong></td>
                    <td>${item.qty.toFixed(1)}</td>
                    <td>${item.unit}</td>
                    <td>${(item.price || 0).toFixed(2)}</td>
                    <td>${itemTotal}</td>
                    <td><button class="remove-btn" onclick="removeItem('${kitchen}', ${idx})">${t('remove')}</button></td>
                </tr>`;
            });
        }
    }
}

function removeItem(kitchen, index) { kitchenData[kitchen].cart.splice(index, 1); renderCart(kitchen); saveCart(); showToast("Item removed"); }
function clearCart(kitchen) { if (confirm("Clear all items?")) { kitchenData[kitchen].cart = []; renderCart(kitchen); saveCart(); showToast("Cart cleared"); } }
function exportToExcel(kitchen) {
    const cart = kitchenData[kitchen].cart;
    if (!cart.length) { showToast("No items"); return; }
    let csv = "Code,Item,Quantity,Unit,Price,Total Value\n";
    cart.forEach(i => { const total = i.qty * (i.price || 0); csv += `${i.code},${i.name},${i.qty.toFixed(1)},${i.unit},${(i.price || 0).toFixed(2)},${total.toFixed(2)}\n`; });
    const blob = new Blob([csv], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `order_${kitchen}_${chefNames[kitchen]}.csv`;
    link.click();
    showToast("Exporting...");
}

    const kitchenRequests = allRequests.filter(r => r.section === kitchen);
    console.log(`Loading ${kitchenRequests.length} requests for ${kitchen}`);
    
    if (!kitchenRequests.length) { container.innerHTML = `<div class="empty-state">📭 ${t('noRequests')}</div>`; return; }
    container.innerHTML = "";
    [...kitchenRequests].reverse().forEach(req => {
        const status = getOverallStatus(req.items);
        console.log(`Request ${req.requestId} status: ${status}`);
        
        let statusClass = "status-pending", statusText = t('pending');
        if (status === "approved") { statusClass = "status-approved"; statusText = t('approved'); }
        else if (status === "rejected") { statusClass = "status-rejected"; statusText = t('rejected'); }
        else if (status === "partial") { statusClass = "status-partial"; statusText = t('partial'); }
        
        const firstAdmin = req.items.find(i => i.approvedBy || i.rejectedBy);
        const adminName = firstAdmin ? (firstAdmin.approvedBy || firstAdmin.rejectedBy) : t('waitingForAdmin');
        let requestTotalValue = 0;
        req.items.forEach(item => { requestTotalValue += (item.originalQty) * (item.price || 0); });
        let itemsHtml = `<div class="table-wrapper"><table class="cart-table"><thead><tr><th>${t('code')}</th><th>${t('item')}</th><th>${t('qty')}</th><th>${t('unit')}</th><th>${t('price')}</th><th>${t('total')}</th><th>${t('approvedQty')}</th><th>${t('status')}</th></tr></thead><tbody>`;
        let approvedTotalValue = 0;
        req.items.forEach(item => {
            const qty = item.originalQty;
            const price = item.price || 0;
            const approvedQty = item.status === "approved" ? (item.approvedQty || qty) : 0;
            const total = (item.status === "approved" ? approvedQty : 0) * price;
            if(item.status === "approved") { approvedTotalValue += total; }
            const displayName = currentLang === 'ar' && item.name_ar ? item.name_ar : item.name;
            let statusDisplay = "", statusColor = "", rejectionHtml = "";
            if(item.status === "approved") { statusDisplay = `✅ ${t('approved')}`; statusColor = "#27ae60"; }
            else if(item.status === "rejected") { statusDisplay = `❌ ${t('rejected')}`; statusColor = "#e74c3c"; if(item.rejectionReason) { rejectionHtml = `<div class="rejection-reason">${t('reason')} ${escapeHtml(item.rejectionReason)}</div>`; } }
            else { statusDisplay = `⏳ ${t('pending')}`; statusColor = "#f39c12"; }
            itemsHtml += `<tr>
                <td>${item.code}</td>
                <td><div><strong>${escapeHtml(displayName)}</strong></div></td>
                <td>${qty.toFixed(1)}</td>
                <td>${item.unit}</td>
                <td>${price.toFixed(2)}</td>
                <td>${(qty * price).toFixed(2)}</td>
                <td>${approvedQty > 0 ? approvedQty.toFixed(1) : "0"}</td>
                <td><span style="color:${statusColor}; font-weight:600;">${statusDisplay}</span>${rejectionHtml}</td>
            </tr>`;
        });
        itemsHtml += `<tr style="background:#f8f9fa; font-weight:bold;"><td colspan="7" style="text-align:right;">💰 ${t('totalValue')} (Approved only):</td><td><span class="price-total">${approvedTotalValue.toFixed(2)} ${t('egp')}</span></td></tr>`;
        itemsHtml += `</tbody></table></div>`;
        container.innerHTML += `<div class="request-card"><div class="request-card-header"><span class="request-id">📄 ${req.requestId}</span><div style="display:flex; gap:10px; flex-wrap:wrap;"><span style="background:linear-gradient(135deg, #1e3c72, #2a5298); color:white; padding:6px 14px; border-radius:20px; font-size:0.75rem;">💰 ${t('totalValue')}: ${requestTotalValue.toFixed(2)} ${t('egp')}</span><span class="approved-by-text">${t('approvedBy')}: <span>${escapeHtml(adminName)}</span></span><span class="status-badge ${statusClass}">${statusText}</span></div></div><div class="request-info-row"><div class="info-item"><div class="info-label">👨‍🍳 ${t('chefLabel')}</div><div class="info-value">${escapeHtml(req.chefName)}</div></div><div class="info-item"><div class="info-label">📅 ${t('submitted')}</div><div class="info-value">${req.submittedAt}</div></div></div>${itemsHtml}</div>`;
    });
}

function loadOrderHistory(kitchen) {
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const container = document.getElementById(`orderHistoryContainer_${kitchenId}`);
    if (!container) return;
    const fromDate = document.getElementById(`historyFrom_${kitchenId}`)?.value || "";
    const toDate = document.getElementById(`historyTo_${kitchenId}`)?.value || "";
    let historyOrders = allRequests.filter(r => { const orderStatus = getOverallStatus(r.items); return r.section === kitchen && orderStatus !== "pending"; });
    if (fromDate) { historyOrders = historyOrders.filter(r => r.timestamp >= new Date(fromDate).getTime()); }
    if (toDate) { const end = new Date(toDate); end.setHours(23, 59, 59, 999); historyOrders = historyOrders.filter(r => r.timestamp <= end.getTime()); }
    historyOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    if (historyOrders.length === 0) { container.innerHTML = '<div class="empty-state">📭 ' + t('noHistory') + '</div>'; return; }
    container.innerHTML = "";
    historyOrders.forEach(req => {
        const status = getOverallStatus(req.items);
        let statusClass = "status-pending", statusText = t('pending');
        if (status === "approved") { statusClass = "status-approved"; statusText = t('approved'); }
        else if (status === "rejected") { statusClass = "status-rejected"; statusText = t('rejected'); }
        else if (status === "partial") { statusClass = "status-partial"; statusText = t('partial'); }
        const firstAdmin = req.items.find(i => i.approvedBy || i.rejectedBy);
        const adminName = firstAdmin ? (firstAdmin.approvedBy || firstAdmin.rejectedBy) : t('waitingForAdmin');
        let requestTotalValue = 0, approvedTotalValue = 0;
        req.items.forEach(item => { requestTotalValue += (item.originalQty) * (item.price || 0); if (item.status === "approved") { approvedTotalValue += (item.approvedQty || item.originalQty) * (item.price || 0); } });
        let itemsHtml = `<div class="table-wrapper"><table class="cart-table"><thead><tr><th>${t('code')}</th><th>${t('item')}</th><th>${t('qty')}</th><th>${t('unit')}</th><th>${t('price')}</th><th>${t('approvedQty')}</th><th>${t('status')}</th></tr></thead><tbody>`;
        req.items.forEach(item => {
            const displayName = currentLang === 'ar' && item.name_ar ? item.name_ar : item.name;
            const approvedQty = item.status === "approved" ? (item.approvedQty || item.originalQty) : 0;
            let statusDisplay = "", statusColor = "";
            if (item.status === "approved") { statusDisplay = `✅ ${t('approved')}`; statusColor = "#27ae60"; }
            else if (item.status === "rejected") { statusDisplay = `❌ ${t('rejected')}`; statusColor = "#e74c3c"; if(item.rejectionReason) { statusDisplay += `<div class="rejection-reason">${t('reason')} ${escapeHtml(item.rejectionReason)}</div>`; } }
            else { statusDisplay = `⏳ ${t('pending')}`; statusColor = "#f39c12"; }
            itemsHtml += `<tr>
                <td>${item.code}</td>
                <td><strong>${escapeHtml(displayName)}</strong></td>
                <td>${item.originalQty.toFixed(1)}</td>
                <td>${item.unit}</td>
                <td>${(item.price || 0).toFixed(2)}</td>
                <td>${approvedQty > 0 ? approvedQty.toFixed(1) : "0"}</td>
                <td><span style="color:${statusColor}; font-weight:600;">${statusDisplay}</span></td>
            </tr>`;
        });
        itemsHtml += `<tr style="background:#f8f9fa; font-weight:bold;"><td colspan="6" style="text-align:right;">💰 ${t('totalValue')} (Approved):</td><td><span class="price-total">${approvedTotalValue.toFixed(2)} ${t('egp')}</span></td></tr>`;
        itemsHtml += `</tbody></table></div>`;
        container.innerHTML += `<div class="request-card"><div class="request-card-header"><span class="request-id">📜 ${req.requestId}</span><div style="display:flex; gap:10px; flex-wrap:wrap;"><span style="background:linear-gradient(135deg, #1e3c72, #2a5298); color:white; padding:6px 14px; border-radius:20px; font-size:0.75rem;">💰 ${requestTotalValue.toFixed(2)} ${t('egp')}</span><span class="approved-by-text">${t('approvedBy')}: <span>${escapeHtml(adminName)}</span></span><span class="status-badge ${statusClass}">${statusText}</span></div></div><div class="request-info-row"><div class="info-item"><div class="info-label">👨‍🍳 ${t('chefLabel')}</div><div class="info-value">${escapeHtml(req.chefName)}</div></div><div class="info-item"><div class="info-label">📅 ${t('submitted')}</div><div class="info-value">${req.submittedAt}</div></div></div>${itemsHtml}</div>`;
    });
}

function toggleHistory(kitchen) {
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const section = document.getElementById(`historySection_${kitchenId}`);
    if (!section) return;
    if (section.style.display === "none" || section.style.display === "") {
        section.style.display = "block";
        localStorage.setItem("historyOpen_" + kitchen, "true");
        loadOrderHistory(kitchen);
    } else { section.style.display = "none"; localStorage.setItem("historyOpen_" + kitchen, "false"); }
}

function restoreHistoryState(kitchen) {
    const kitchenId = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const section = document.getElementById(`historySection_${kitchenId}`);
    if (!section) return;
    const open = localStorage.getItem("historyOpen_" + kitchen);
    if (open === "true") section.style.display = "block";
    else section.style.display = "none";
}

// ============ PAGE GENERATION ============
function onChefNameChange(kitchen) {
    const id = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    const newName = document.getElementById(`chefName_${id}`).value.trim();
    chefNames[kitchen] = newName;
    saveChefNames();
    renderItemsList(kitchen);
    loadMyRequests(kitchen);
    if(document.getElementById(`historySection_${id}`)?.style.display === "block") { loadOrderHistory(kitchen); }
}

function createKitchenPage(kitchen) {
    const id = kitchen.replace(/\s/g, '_').replace(/\//g, '_');
    return `<div class="kitchen-page" id="page_${id}"><div class="card"><h3>👨‍🍳 ${t('chefInfo')} - ${kitchen}</h3><div class="input-group"><label>${t('chefName')} <span class="required">*</span></label><input type="text" id="chefName_${id}" placeholder="${t('enterChefName')}" onchange="onChefNameChange('${kitchen}')"></div></div>
    <div class="card"><h3>📦 ${kitchen} ${t('items')} <span style="font-size:11px;">(${t('searchByFirstChar')})</span></h3><div id="itemsListContainer_${id}"></div></div>
    <div class="card"><h3>🛒 ${t('currentRequest')} <button class="history-toggle-btn" onclick="toggleHistory('${kitchen}')">📜 ${t('viewHistory')}</button></h3>
    <div class="cart-stats"><span>📦 ${t('totalQty')}: <strong id="totalItems_${id}">0</strong></span><span>📋 ${t('totalItems')}: <strong id="lineCount_${id}">0</strong></span><span>💰 ${t('totalValue')}: <strong id="totalValue_${id}">0.00</strong> ${t('egp')}</span></div>
    <div class="desktop-table-view"><div class="table-wrapper"><table class="cart-table"><thead><tr><th>${t('code')}</th><th>${t('item')}</th><th>${t('qty')}</th><th>${t('unit')}</th><th>${t('price')}</th><th>${t('total')}</th><th></th></tr></thead><tbody id="cartTableDesktop_${id}"></tbody></table></div></div>
    <div class="button-group"><button class="btn btn-success" onclick="submitRequest('${kitchen}')">📤 ${t('submit')}</button><button class="btn btn-warning" onclick="exportToExcel('${kitchen}')">📎 ${t('export')}</button><button class="btn btn-danger" onclick="clearCart('${kitchen}')">🗑️ ${t('clear')}</button></div></div>
    <div class="card"><h3>📜 ${t('myRequests')} <span style="font-size:11px;">(${t('showsAdminPrice')})</span></h3><div id="myRequestsDesktop_${id}"></div></div>
    <div class="card"><h3>📜 ${t('orderHistory')}</h3><div id="historySection_${id}" class="history-section" style="display:none;"><div class="history-toolbar"><input type="date" id="historyFrom_${id}" placeholder="${t('fromDate')}"><input type="date" id="historyTo_${id}" placeholder="${t('toDate')}"><button class="history-filter-btn" onclick="loadOrderHistory('${kitchen}')">🔍 ${t('filter')}</button></div><div id="orderHistoryContainer_${id}"></div></div></div></div>`;
}

function generatePages() {
    const tabs = document.getElementById("tabsContainer");
    const pages = document.getElementById("kitchenPagesContainer");
    tabs.innerHTML = "";
    pages.innerHTML = "";
    kitchens.forEach(k => { tabs.innerHTML += `<button class="tab-btn" onclick="showKitchenPasswordModal('${k}')">${k}</button>`; pages.innerHTML += createKitchenPage(k); });
}

async function selectKitchen(kitchen) {
    currentKitchen = kitchen;
    document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); if (btn.innerText.includes(kitchen)) btn.classList.add('active'); });
    document.querySelectorAll('.kitchen-page').forEach(p => p.classList.remove('active-page'));
    const pageId = `page_${kitchen.replace(/\s/g, '_').replace(/\//g, '_')}`;
    const target = document.getElementById(pageId);
    if (target) target.classList.add('active-page');
    const chefInput = document.getElementById(`chefName_${kitchen.replace(/\s/g, '_').replace(/\//g, '_')}`);
    if (chefInput) chefInput.value = chefNames[kitchen] || "";
    await renderItemsList(kitchen);
    renderCart(kitchen);
    loadMyRequests(kitchen);
    restoreHistoryState(kitchen);
    localStorage.setItem("lastSelectedKitchen", kitchen);
}

function loadLastSelectedKitchen() { const lastKitchen = localStorage.getItem("lastSelectedKitchen"); if (lastKitchen && unlockedKitchens[lastKitchen]) { selectKitchen(lastKitchen); } }

function startAutoRefresh() {
    if(autoRefreshInterval) clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(function() {
        loadRequestsFromFirebase();
        if(currentKitchen) { loadMyRequests(currentKitchen); renderCart(currentKitchen); }
    }, 60000);
}

async function manualRefresh() {
    showToast("🔄 Refreshing...");
    await loadRequestsFromFirebase();
    if (currentKitchen) {
        loadMyRequests(currentKitchen);
        renderCart(currentKitchen);
        if(document.getElementById(`historySection_${currentKitchen.replace(/\s/g, '_').replace(/\//g, '_')}`)?.style.display === "block") {
            loadOrderHistory(currentKitchen);
        }
    }
}

async function forceReloadItems() {
    showToast("🔄 Reloading items...");
    for (const kitchen of kitchens) kitchenItemsCache[kitchen] = null;
    if (currentKitchen) { await renderItemsList(currentKitchen); showToast(`✅ Reloaded items for ${currentKitchen}`); }
}

function logout() {
    if (confirm("Logout? All unlocked kitchens will be locked.")) {
        if(autoRefreshInterval) clearInterval(autoRefreshInterval);
        unlockedKitchens = {};
        localStorage.removeItem("unlockedKitchens");
        kitchens.forEach(k => { kitchenData[k].cart = []; renderCart(k); });
        saveCart();
        currentKitchen = null;
        showToast("Logged out.");
        setTimeout(() => location.reload(), 1000);
    }
}

// ============ INITIALIZATION ============
window.addEventListener('DOMContentLoaded', () => {
    console.log("🚀 Starting Chef Dashboard...");
    generatePages();
    startAutoRefresh();
    loadRequestsFromFirebase();
    loadLastSelectedKitchen();
    initFreehandModeListener();
    
    db.collection("kitchen_requests").onSnapshot(() => { 
        console.log("🔄 Real-time update received");
        loadRequestsFromFirebase(); 
    });
    
    console.log("✅ Chef Dashboard ready");
});
</script>
</body>
