<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Indigo Admin • Firebase Auth</title>
    <!-- Google Fonts + Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
            top: -120px;
            left: -120px;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(139, 92, 246, 0) 70%);
            bottom: -120px;
            right: -120px;
            z-index: 0;
            pointer-events: none;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            background: rgba(12, 15, 28, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 1.75rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(99, 102, 241, 0.2) inset;
            padding: 1.8rem 1.5rem;
            transition: all 0.3s ease;
            z-index: 2;
            position: relative;
        }

        .login-container:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(99, 102, 241, 0.25) inset;
        }

        .brand {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo-wrapper {
            background: linear-gradient(145deg, #1a1c2e, #0f1120);
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            box-shadow: 0 10px 20px -6px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(99, 102, 241, 0.4) inset;
        }

        .logo-wrapper i {
            font-size: 2rem;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E0E7FF, #A5B4FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .subhead {
            color: #8b92b0;
            font-size: 0.75rem;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 1.3rem;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #818cf8;
            font-size: 1rem;
            transition: all 0.2s;
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
        }

        input {
            width: 100%;
            background: rgba(5, 7, 18, 0.7);
            border: 1.5px solid #2a2d44;
            border-radius: 1rem;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #f0f4ff;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            outline: none;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(10, 12, 25, 0.95);
        }

        input::placeholder {
            color: #4a4f6e;
            font-weight: 400;
            font-size: 0.85rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin: 1.5rem 0 0.5rem;
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            font-weight: 700;
            padding: 0.9rem 0.5rem;
            border-radius: 2rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: none;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
            min-height: 52px;
            box-sizing: border-box;
            background: linear-gradient(105deg, #6366f1, #4f46e5);
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .btn-primary, .btn-devmode, .btn-secondary {
            background: linear-gradient(105deg, #6366f1, #4f46e5);
            color: #ffffff;
        }

        .btn-primary:hover, .btn-devmode:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            background: linear-gradient(105deg, #818cf8, #6366f1);
            box-shadow: 0 10px 20px -4px rgba(99, 102, 241, 0.45);
        }

        .btn-primary:active, .btn-devmode:active, .btn-secondary:active {
            transform: translateY(1px);
        }

        .btn-devmode {
            position: relative;
            overflow: hidden;
        }

        .btn-devmode::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-devmode:hover::before {
            left: 100%;
        }

        .alert-message {
            background: rgba(220, 38, 38, 0.12);
            border-left: 3px solid #ef4444;
            padding: 0.7rem 1rem;
            border-radius: 0.9rem;
            font-size: 0.75rem;
            margin-top: 1rem;
            color: #fecaca;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            animation: slideDown 0.25s ease;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.12);
            border-left: 3px solid #22c55e;
            padding: 0.7rem 1rem;
            border-radius: 0.9rem;
            font-size: 0.75rem;
            margin-top: 1rem;
            color: #bbf7d0;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            animation: slideDown 0.25s ease;
        }

        .warning-message {
            background: rgba(245, 158, 11, 0.12);
            border-left: 3px solid #f59e0b;
            padding: 0.7rem 1rem;
            border-radius: 0.9rem;
            font-size: 0.75rem;
            margin-top: 1rem;
            color: #fde68a;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none;
        }

        hr {
            margin: 1.5rem 0 0.7rem;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #6366f140, transparent);
        }

        .footer-note {
            text-align: center;
            font-size: 0.65rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            display: inline-block;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:focus-visible {
            outline: 2px solid #a5b4fc;
            outline-offset: 2px;
        }

        .config-status {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 0.8rem;
        }

        .config-badge {
            background: rgba(99, 102, 241, 0.15);
            border-radius: 2rem;
            padding: 0.3rem 0.8rem;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #a5b4fc;
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 1.3rem 1.2rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .btn {
                padding: 0.75rem 0.5rem;
                font-size: 0.85rem;
                min-height: 46px;
            }
            input {
                padding: 0.75rem 1rem 0.75rem 2.6rem;
                font-size: 0.85rem;
            }
            .logo-wrapper {
                width: 54px;
                height: 54px;
            }
            .logo-wrapper i {
                font-size: 1.7rem;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 0.8rem;
                align-items: flex-start;
            }
            .login-container {
                margin: 1rem auto;
                padding: 1.2rem 1.5rem;
            }
            .brand {
                margin-bottom: 1rem;
            }
            .logo-wrapper {
                width: 48px;
                height: 48px;
                margin-bottom: 0.6rem;
            }
            .logo-wrapper i {
                font-size: 1.5rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .action-buttons {
                gap: 0.6rem;
                margin: 1rem 0 0.3rem;
            }
            .btn {
                padding: 0.6rem 0.5rem;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
<div class="grid-overlay"></div>

<div class="login-container">
    <div class="brand">
        <div class="logo-wrapper">
            <i class="fas fa-fire"></i>
        </div>
        <h1>Indigo Admin</h1>
        <div class="subhead">Firebase Authentication • Secure Access</div>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="admin@example.com" autocomplete="email" inputmode="email">
        </div>

        <div class="input-group">
            <i class="fas fa-lock-keyhole"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="fas fa-arrow-right-to-bracket"></i> Login
            </button>
            <button type="button" class="btn btn-devmode" id="devmodeBtn">
                <i class="fas fa-microchip"></i> DEVMODE
            </button>
            <button type="button" class="btn btn-secondary" id="goBackBtn">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
        </div>

        <div id="errorAlert" class="alert-message hidden">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">Authentication failed</span>
        </div>
        <div id="successAlert" class="success-message hidden">
            <i class="fas fa-check-circle"></i>
            <span id="successText">Login successful! Redirecting...</span>
        </div>
        <div id="warningAlert" class="warning-message hidden">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="warningText">Warning</span>
        </div>
        
        <div class="config-status" id="configStatus">
            <div class="config-badge">
                <i class="fas fa-database"></i>
                <span id="configStatusText">Checking Firebase config...</span>
            </div>
        </div>
    </form>

    <hr>
    <div class="footer-note">
        <i class="fas fa-shield-halos"></i>
        <span>Firebase Authentication • Encrypted session</span>
    </div>
</div>

<!-- Firebase Config File (external) -->
<script src="firebase-config.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const errorTextSpan = document.getElementById('errorText');
    const successAlert = document.getElementById('successAlert');
    const successTextSpan = document.getElementById('successText');
    const warningAlert = document.getElementById('warningAlert');
    const warningTextSpan = document.getElementById('warningText');
    const goBackBtn = document.getElementById('goBackBtn');
    const devmodeBtn = document.getElementById('devmodeBtn');
    const loginSubmitBtn = document.getElementById('loginBtn');
    const configStatusText = document.getElementById('configStatusText');
    
    let auth = null;
    let isAuthenticating = false;
    let firebaseReady = false;
    
    function hideAllMessages() {
        errorAlert.classList.add('hidden');
        successAlert.classList.add('hidden');
        warningAlert.classList.add('hidden');
    }
    
    function showError(message) {
        hideAllMessages();
        errorTextSpan.innerText = message;
        errorAlert.classList.remove('hidden');
        if (window.errorTimeout) clearTimeout(window.errorTimeout);
        window.errorTimeout = setTimeout(() => {
            errorAlert.classList.add('hidden');
        }, 5000);
    }
    
    function showSuccess(message) {
        hideAllMessages();
        successTextSpan.innerText = message;
        successAlert.classList.remove('hidden');
        if (window.successTimeout) clearTimeout(window.successTimeout);
        window.successTimeout = setTimeout(() => {
            successAlert.classList.add('hidden');
        }, 3000);
    }
    
    function showWarning(message) {
        hideAllMessages();
        warningTextSpan.innerText = message;
        warningAlert.classList.remove('hidden');
        if (window.warningTimeout) clearTimeout(window.warningTimeout);
        window.warningTimeout = setTimeout(() => {
            warningAlert.classList.add('hidden');
        }, 5000);
    }
    
    function setLoading(button, isLoading) {
        if (isLoading) {
            button.disabled = true;
            button.style.opacity = '0.85';
            const originalHTML = button.innerHTML;
            button.setAttribute('data-original', originalHTML);
            button.innerHTML = '<span class="loading-spinner"></span> Authenticating...';
        } else {
            button.disabled = false;
            button.style.opacity = '1';
            const original = button.getAttribute('data-original');
            if (original) button.innerHTML = original;
            else button.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
        }
    }
    
    function initFirebase() {
        const firebaseConfig = window.firebaseConfig;
        
        if (!firebaseConfig) {
            configStatusText.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Missing firebase-config.js';
            configStatusText.style.color = '#f87171';
            showWarning('⚠️ Firebase config file not found. Create firebase-config.js with your Firebase project settings.');
            console.error("Firebase config not found. Create firebase-config.js with: window.firebaseConfig = { apiKey, authDomain, projectId, ... }");
            return false;
        }
        
        const requiredFields = ['apiKey', 'authDomain', 'projectId'];
        const missingFields = requiredFields.filter(field => !firebaseConfig[field]);
        
        if (missingFields.length > 0) {
            configStatusText.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Invalid config: missing ${missingFields.join(', ')}`;
            configStatusText.style.color = '#f87171';
            showWarning(`⚠️ Firebase config incomplete. Missing: ${missingFields.join(', ')}`);
            return false;
        }
        
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            firebaseReady = true;
            configStatusText.innerHTML = '<i class="fas fa-check-circle"></i> Firebase ready';
            configStatusText.style.color = '#86efac';
            console.log("✅ Firebase initialized successfully");
            return true;
        } catch (error) {
            configStatusText.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Connection error';
            configStatusText.style.color = '#f87171';
            showError("🔥 Firebase connection failed: " + error.message);
            return false;
        }
    }
    
    // Check auth state without showing misleading messages
    function checkAuthState() {
        if (!auth || !firebaseReady) return;
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User already logged in:", user.email);
                // Only show success if user is actually logged in
                showSuccess(`Welcome back, ${user.email}! Redirecting...`);
                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 1500);
            }
        });
    }
    
    async function handleLogin(email, password) {
        if (!auth || !firebaseReady) {
            showError("Firebase not ready. Please check configuration.");
            return false;
        }
        
        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            console.log("Login successful:", user.email);
            showSuccess(`✅ Welcome ${user.email}! Redirecting to admin panel...`);
            
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 1500);
            return true;
        } catch (error) {
            console.error("Login error:", error.code);
            
            switch (error.code) {
                case 'auth/invalid-email':
                    showError("❌ Invalid email format. Please enter a valid email address.");
                    break;
                case 'auth/user-disabled':
                    showError("🔒 This account has been disabled. Contact administrator.");
                    break;
                case 'auth/user-not-found':
                    showError("📧 No account found with this email address.");
                    break;
                case 'auth/wrong-password':
                    showError("🔑 Incorrect password. Please try again.");
                    break;
                case 'auth/too-many-requests':
                    showError("⏱️ Too many failed attempts. Please try again later.");
                    break;
                case 'auth/network-request-failed':
                    showError("🌐 Network error. Check your internet connection.");
                    break;
                default:
                    showError(`Authentication failed: ${error.message}`);
            }
            return false;
        }
    }
    
    loginForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const emailVal = emailInput.value.trim();
        const passwordVal = passwordInput.value;
        
        hideAllMessages();
        
        if (!emailVal || !passwordVal) {
            showError("❌ Both email and password are required.");
            return false;
        }
        
        const emailRegex = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
        if (!emailRegex.test(emailVal)) {
            showError("⚠️ Please enter a valid email address.");
            return false;
        }
        
        if (!firebaseReady) {
            showError("⚠️ Firebase is not configured. Please check firebase-config.js file.");
            return false;
        }
        
        if (isAuthenticating) return false;
        isAuthenticating = true;
        
        setLoading(loginSubmitBtn, true);
        
        try {
            await handleLogin(emailVal, passwordVal);
        } finally {
            setLoading(loginSubmitBtn, false);
            isAuthenticating = false;
        }
    });
    
    devmodeBtn.addEventListener('click', function() {
        devmodeBtn.style.transform = 'scale(0.97)';
        setTimeout(() => { devmodeBtn.style.transform = ''; }, 120);
        window.location.href = "dev_console.html";
    });
    
    goBackBtn.addEventListener('click', function() {
        goBackBtn.style.transform = 'scale(0.97)';
        setTimeout(() => { goBackBtn.style.transform = ''; }, 120);
        window.location.href = "index.html";
    });
    
    emailInput.addEventListener('input', () => hideAllMessages());
    passwordInput.addEventListener('input', () => hideAllMessages());
    
    // Wait for external config script to load
    setTimeout(() => {
        const initialized = initFirebase();
        if (initialized) {
            checkAuthState();
        }
    }, 150);
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'd' || e.key === 'D') {
            if (document.activeElement !== emailInput && document.activeElement !== passwordInput) {
                devmodeBtn.click();
            }
        }
        if (e.key === 'Escape') {
            hideAllMessages();
        }
    });
    
    const allBtns = document.querySelectorAll('.btn');
    allBtns.forEach(btn => {
        btn.addEventListener('touchstart', function() {
            this.style.transform = 'scale(0.97)';
        });
        btn.addEventListener('touchend', function() {
            this.style.transform = '';
        });
    });
    
    console.log("%c🔷 INDIGO ADMIN • FIREBASE AUTHENTICATION", "color: #818cf8; font-size: 12px; font-weight: bold;");
    console.log("📁 Create firebase-config.js with:");
    console.log('   window.firebaseConfig = {');
    console.log('     apiKey: "YOUR_API_KEY",');
    console.log('     authDomain: "YOUR_AUTH_DOMAIN",');
    console.log('     projectId: "YOUR_PROJECT_ID",');
    console.log('     storageBucket: "YOUR_BUCKET",');
    console.log('     messagingSenderId: "YOUR_SENDER_ID",');
    console.log('     appId: "YOUR_APP_ID"');
    console.log('   };');
</script>
</body>
</html>
